TARGET_FAMILY_REGEX='^ubuntu-[a-z][a-z0-9-]*$'
TARGET_ARCHES='amd64 arm64'
TARGET_LABEL_STRIP_PREFIX='ubuntu-'
TARGET_LABEL_TEMPLATE='Ubuntu {suffix}'
TARGET_LABEL_CASE='upper-first'
TARGET_INSTALL_TOOL='apt'
TARGET_DEB_SUITE_TEMPLATE='{suffix}'
TARGET_DEB_SUITE_STRIP_PREFIX='ubuntu-'
TARGET_DEB_MIRROR='http://archive.ubuntu.com/ubuntu'
TARGET_CONTAINER_IMAGE='debian:stable'
TARGET_CONTAINER_BUILD_CMD='apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y apt-utils ca-certificates curl debian-archive-keyring devscripts dpkg-dev fakeroot findutils git gnupg gzip patch pbuilder sed tar ubuntu-keyring xz-utils bash && rm -rf /var/lib/apt/lists/*'
